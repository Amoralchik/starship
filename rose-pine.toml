format = """
[](fg:overlay)\
$os\
$username\
$directory\
$git_branch\
$git_status\
[](fg:overlay)\
$fill\
[](fg:overlay)\
$golang\
$nodejs\
$rust\
$python\
$time[](fg:overlay)\n\
[$character](fg:iris)\
"""

palette = "rose-pine"

[palettes.rose-pine]
overlay = '#26233a'
love = '#eb6f92'
gold = '#f6c177'
rose = '#ebbcba'
pine = '#31748f'
foam = '#9ccfd8'
iris = '#c4a7e7'

[character]
success_symbol = '[❯](bold iris)'
error_symbol = '[❯](bold love)'

[directory]
format = "[ $path ]($style)"
style = "bg:overlay fg:pine"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙"
Downloads = " "
Music = " "
Pictures = " "

[fill]
symbol = " "

[git_branch]
format = "[ $symbol $branch ]($style)"
style = "bg:overlay fg:foam"
symbol = ""

[git_status]
disabled = false
style = "bg:overlay fg:love"
format = '([$all_status$ahead_behind]($style))'
up_to_date = '[ ✓ ](bg:overlay fg:iris)'
untracked = '[?\($count\)](bg:overlay fg:gold)'
stashed = '[\$](bg:overlay fg:iris)'
modified = '[!\($count\)](bg:overlay fg:gold)'
renamed = '[»\($count\)](bg:overlay fg:iris)'
deleted = '[✘\($count\)](style)'
staged = '[++\($count\)](bg:overlay fg:gold)'
ahead = '[⇡\(${count}\)](bg:overlay fg:foam)'
diverged = '⇕[\[](bg:overlay fg:iris)[⇡\(${ahead_count}\)](bg:overlay fg:foam)[⇣\(${behind_count}\)](bg:overlay fg:rose)[\]](bg:overlay fg:iris)'
behind = '[⇣\(${count}\)](bg:overlay fg:rose)'

[time]
disabled = false
format = "[ $time 󰴈 ]($style)"
style = "bg:overlay fg:rose"
time_format = "%T"
use_12hr = false

[username]
disabled = false
format = "[$user ]($style)"
show_always = true
style_root = "bg:overlay fg:iris"
style_user = "bg:overlay fg:iris"

[os]
disabled = false
style = "bg:overlay fg:iris"

[os.symbols]
Arch = " "
Ubuntu = " "
Windows = "󰍲 "

# Languages

[golang]
style = "bg:overlay fg:pine"
format = "[ $symbol$version ]($style)"
disabled = false
symbol = " "

[nodejs]
style = "bg:overlay fg:pine"
format = "[ $symbol$version ]($style)"
disabled = false
symbol = "󰎙 "

[rust]
style = "bg:overlay fg:pine"
format = "[ $symbol$version ]($style)"
disabled = false
symbol = " "

[python]
style = "bg:overlay fg:pine"
format = "[ $symbol$version ]($style)"
disabled = false
symbol = ' '

[zig]
style = "bg:overlay fg:pine"
format = "[ $symbol$environment ]($style)"
disabled = false
symbol = " "
